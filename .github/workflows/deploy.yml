name: Upload images to S3

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::872927006383:role/RoleforGithub
          aws-region: ap-south-1

      - name: Sync images to S3
        run: aws s3 cp ./index.html s3://testbkts54-872927006383-ap-south-1-an/index.html
